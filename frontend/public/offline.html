<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F97316">
  <title>ENGINES JDS — Sin conexión</title>
  <style>
    * { margin: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #050A14;
      color: #ffffff;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .logo { font-size: 3rem; margin-bottom: 8px; }
    .brand { font-size: 1.4rem; font-weight: 800; letter-spacing: 0.04em; margin-bottom: 32px; }
    .brand span { color: #F97316; }
    .icon {
      width: 80px; height: 80px; margin-bottom: 24px;
      border-radius: 50%;
      background: rgba(249, 115, 22, 0.12);
      display: flex; align-items: center; justify-content: center;
    }
    .icon svg { color: #F97316; }
    h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: 12px; }
    p { color: rgba(255,255,255,0.5); font-size: 0.95rem; line-height: 1.6; max-width: 400px; margin-bottom: 32px; }
    .retry {
      padding: 12px 28px;
      border: 1px solid rgba(249,115,22,0.4);
      border-radius: 10px;
      background: rgba(249,115,22,0.12);
      color: #F97316;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s;
    }
    .retry:hover { background: rgba(249,115,22,0.2); }
  </style>
</head>
<body>
  <div class="logo">◈</div>
  <div class="brand"><span>ENGINES</span> JDS</div>
  <div class="icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="36" height="36">
      <path d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0 1 19 12.55M5 12.55a10.94 10.94 0 0 1 5.17-2.39M10.71 5.05A16 16 0 0 1 22.56 9M1.42 9a15.91 15.91 0 0 1 4.7-2.88M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"/>
    </svg>
  </div>
  <h1>Sin conexión</h1>
  <p>No tienes conexión a internet en este momento. Verifica tu conexión e intenta de nuevo.</p>
  <a class="retry" href="/" onclick="location.reload(); return false;">Reintentar</a>
</body>
</html>
